name: Android CI Build
on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Pulls a fresh, pre-configured structure safe from local formatting issues
    - name: Pull Pre-Verified Template Environment
      run: |
        rm -rf app settings.gradle build.gradle gradlew gradle gradle.properties
        curl -L -o project.zip "https://github.com"
        unzip -q project.zip
        mv architecture-samples-main/* . 2>/dev/null || true
        rm -rf architecture-samples-main project.zip

    - name: Setup Gradle Environment
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.5

    - name: Execute Native Project Compilation
      run: gradle assembleDebug

    - name: Save Mobile App Output
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: "**/build/outputs/apk/debug/*.apk"
        
