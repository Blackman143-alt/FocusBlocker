name: Android CI Build
on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Clean and Generate Base Files
      run: |
        rm -rf app settings.gradle build.gradle gradlew gradle gradle.properties
        mkdir -p app/src/main/java/com/example/appblocker
        mkdir -p app/src/main/res/xml

        # 1. Base Project Configuration
        cat << 'EOF' > settings.gradle
        rootProject.name = "FocusBlocker"
        include ':app'
        EOF

        # 2. Required Property File for AndroidX
        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        EOF

        # 3. Root build.gradle with repository configurations
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.2.2'
                classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
            }
        }

        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        # 4. App build.gradle configurations
        cat << 'EOF' > app/build.gradle
        apply plugin: 'com.android.application'
        apply plugin: 'org.jetbrains.kotlin.android'

        android {
            namespace 'com.example.appblocker'
            compileSdk 34
            defaultConfig {
                applicationId "com.example.appblocker"
                minSdk 26
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
        }
        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
        }
        EOF

        # 5. Basic Core Layout
        cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
        <?xml version="1.0" encoding="utf-8"?>
        <accessibility-service xmlns:android="http://android.com"
            android:accessibilityEventTypes="typeWindowStateChanged"
            android:accessibilityFeedbackType="feedbackGeneric"
            android:canRetrieveWindowContent="false" />
        EOF

        # 6. Android Manifest XML
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://android.com" package="com.example.appblocker">
            <application android:label="Focus Blocker">
                
                <activity 
                    android:name="com.example.appblocker.MainActivity" 
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>

                <service 
                    android:name="com.example.appblocker.AppBlockerService" 
                    android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE" 
                    android:exported="false">
                    <intent-filter> 
                        <action android:name="android.view.accessibility.AccessibilityService" /> 
                    </intent-filter>
                    <meta-data 
                        android:name="android.view.accessibility.accessibilityservice" 
                        android:resource="@xml/accessibility_service_config" />
                </service>

            </application>
        </manifest>
        EOF

        # 7. Service Implementation
        cat << 'EOF' > app/src/main/java/com/example/appblocker/AppBlockerService.kt
        package com.example.appblocker
        import android.accessibilityservice.AccessibilityService
        import android.content.Intent
        import android.view.accessibility.AccessibilityEvent
        class AppBlockerService : AccessibilityService() {
            private val blockedApps = setOf("com.android.settings", "com.instagram.android")
            override fun onAccessibilityEvent(event: AccessibilityEvent) {
                if (event.eventType == AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) {
                    val openedApp = event.packageName?.toString() ?: return
                    if (blockedApps.contains(openedApp)) {
                        val intent = Intent(Intent.ACTION_MAIN).apply {
                            addCategory(Intent.CATEGORY_HOME)
                            flags = Intent.FLAG_ACTIVITY_NEW_TASK
                        }
                        startActivity(intent)
                    }
                }
            }
            override fun onInterrupt() {}
        }
        EOF

        # 8. Native Framework Main Interface
        cat << 'EOF' > app/src/main/java/com/example/appblocker/MainActivity.kt
        package com.example.appblocker
        import android.content.Intent
        import android.os.Bundle
        import android.provider.Settings
        import android.widget.Button
        import android.app.Activity
        class MainActivity : Activity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                val enableButton = Button(this).apply {
                    text = "Enable App Blocker Service"
                    setOnClickListener {
                        val intent = Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)
                        startActivity(intent)
                    }
                }
                setContentView(enableButton)
            }
        }
        EOF

    - name: Setup Gradle Build Environment
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.5

    - name: Compile and Pack Android Package
      run: gradle assembleDebug

    - name: Save Mobile App Output
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
