name: Android CI Build
on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Force Generate Perfect Project Structure
      run: |
        rm -rf app settings.gradle build.gradle gradlew gradle
        
        # 1. Root settings.gradle
        cat << 'EOF' > settings.gradle
        pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
        }
        rootProject.name = "FocusBlocker"
        include ':app'
        EOF

        # 2. Root build.gradle
        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.2.2' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
        }
        EOF

        # 3. Create deep directories
        mkdir -p app/src/main/java/com/example/appblocker
        mkdir -p app/src/main/res/xml

        # 4. App-level build.gradle
        cat << 'EOF' > app/build.gradle
        plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
        android {
            namespace 'com.example.appblocker'
            compileSdk 34
            defaultConfig {
                applicationId "com.example.appblocker"
                minSdk 26
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
            kotlinOptions { jvmTarget = '17' }
        }
        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
        }
        EOF

        # 5. Accessibility Config XML (FIXED SCHEMA URL)
        cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
        <?xml version="1.0" encoding="utf-8"?>
        <accessibility-service xmlns:android="http://android.com"
            android:accessibilityEventTypes="typeWindowStateChanged"
            android:accessibilityFeedbackType="feedbackGeneric"
            android:accessibilityFlags="flagDefault"
            android:canRetrieveWindowContent="false" />
        EOF

        # 6. Android Manifest XML (FIXED SCHEMA URL)
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://android.com" package="com.example.appblocker">
            <application android:allowBackup="true" android:label="Focus Blocker" android:theme="@android:style/Theme.DeviceDefault.Light">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
                <service android:name=".AppBlockerService" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE" android:exported="false">
                    <intent-filter> <action android:name="android.view.accessibility.AccessibilityService" /> </intent-filter>
                    <meta-data android:name="android.view.accessibility.accessibilityservice" android:resource="@xml/accessibility_service_config" />
                </service>
            </application>
        </manifest>
        EOF

        # 7. Kotlin Service Class
        cat << 'EOF' > app/src/main/java/com/example/appblocker/AppBlockerService.kt
        package com.example.appblocker
        import android.accessibilityservice.AccessibilityService
        import android.content.Intent
        import android.view.accessibility.AccessibilityEvent
        class AppBlockerService : AccessibilityService() {
            private val blockedApps = setOf("com.android.settings", "com.instagram.android")
            override fun onAccessibilityEvent(event: AccessibilityEvent) {
                if (event.eventType == AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) {
                    val openedApp = event.packageName?.toString() ?: return
                    if (blockedApps.contains(openedApp)) { triggerHomeRedirect() }
                }
            }
            private fun triggerHomeRedirect() {
                val intent = Intent(Intent.ACTION_MAIN).apply {
                    addCategory(Intent.CATEGORY_HOME)
                    flags = Intent.FLAG_ACTIVITY_NEW_TASK
                }
                startActivity(intent)
            }
            override fun onInterrupt() {}
        }
        EOF

        # 8. Kotlin MainActivity Class
        cat << 'EOF' > app/src/main/java/com/example/appblocker/MainActivity.kt
        package com.example.appblocker
        import android.content.Intent
        import android.os.Bundle
        import android.provider.Settings
        import android.widget.Button
        import androidx.appcompat.app.AppCompatActivity
        class MainActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                val enableButton = Button(this).apply {
                    text = "Enable App Blocker Service"
                    setOnClickListener {
                        val intent = Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)
                        startActivity(intent)
                    }
                }
                setContentView(enableButton)
            }
        }
        EOF

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.5

    - name: Build Debug APK
      run: gradle assembleDebug

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
